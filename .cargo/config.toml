# Cargo configuration: aliases only.
#
# There is no default target and no default feature. The settings that depend on
# the *chip* — target triple, rustflags, probe runner — live in the per-chip
# `.cargo/config-rp2040.toml` / `.cargo/config-rp2350.toml`, and each points the
# linker's `-L` at its own `memory/<chip>/memory.x`. The *feature* picks the HAL,
# rp-hal or embassy-rp, which is orthogonal: the embassy aliases name the same chip
# config file as the rp-hal ones. Every alias therefore names a chip config and
# the features together, and no feature is a default.
#
# Those per-chip files are the single place the settings live: cargo *appends* a
# `--config` file's `rustflags` array to the base config's, so repeating them here
# would pass `-Tlink.x` twice and define `FLASH` twice.
#
# `.cargo/config-rp2350.toml` carries the RP2350 build options, including a
# RISC-V (Hazard3) alternative.

[alias]
# Every alias names its chip config file and its features. No feature is a
# default, and the config file is what supplies the chip's target, rustflags and
# probe. Each section lines its options up in columns.

# The two chips against rp-hal. `rp2350` is the Interstate 75 W; `rp2040` builds
# the same driver for the RP2040.
build-rp2350 = "build --config .cargo/config-rp2350.toml --release --features rp2350"
run-rp2350   = "run   --config .cargo/config-rp2350.toml --release --features rp2350"
build-rp2040 = "build --config .cargo/config-rp2040.toml --release --features rp2040"
run-rp2040   = "run   --config .cargo/config-rp2040.toml --release --features rp2040"

# The embassy-rp backend: the same chips, the embassy HAL feature.
build-embassy        = "build  --config .cargo/config-rp2350.toml --release --features embassy-rp2350"
run-embassy          = "run    --config .cargo/config-rp2350.toml --release --features embassy-rp2350"
clippy-embassy       = "clippy --config .cargo/config-rp2350.toml --release --features embassy-rp2350"
doc-embassy          = "doc    --config .cargo/config-rp2350.toml --no-deps --features embassy-rp2350"
build-embassy-rp2040 = "build  --config .cargo/config-rp2040.toml --release --features embassy-rp2040"

# The lint, doc and test passes the scripts use; they name the board too, so the
# scripts carry no flags. The test pass keeps the debug profile: `src/driver.rs`
# relies on `debug_assert!`, which `--release` would compile out.
clippy-rp2350 = "clippy --config .cargo/config-rp2350.toml --release --features rp2350"
doc-rp2350    = "doc    --config .cargo/config-rp2350.toml --no-deps --features rp2350"
test-rp2350   = "test   --config .cargo/config-rp2350.toml --lib     --features rp2350"

# The examples, each naming its board config and features itself.
run-gradient       = "run --config .cargo/config-rp2350.toml --release --example gradient  --features rp2350"
run-ghost          = "run --config .cargo/config-rp2350.toml --release --example ghost     --features rp2350"
run-ladder         = "run --config .cargo/config-rp2350.toml --release --example ladder    --features rp2350"
run-latched        = "run --config .cargo/config-rp2350.toml --release --example latched   --features rp2350"
run-telemetry      = "run --config .cargo/config-rp2350.toml --release --example telemetry --features rp2350"
run-latched-rp2040 = "run --config .cargo/config-rp2040.toml --release --example latched   --features rp2040"
run-gradient-embassy = "run --config .cargo/config-rp2350.toml --release --example gradient-embassy --features embassy-rp2350"

[env]
DEFMT_LOG = "info"
