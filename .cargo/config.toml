# Cargo configuration: aliases only.
#
# There is no default target and no default feature. Every alias names the
# board's `.cargo/config-*.toml` (target, rustflags, probe runner) and the board
# feature together, so the target, the HAL and the memory map always change
# together. Those per-board files are the single place the settings live: cargo
# *appends* a `--config` file's `rustflags` array to the base config's, so
# repeating them here would pass `-Tlink.x` twice and define `FLASH` twice.
#
# `.cargo/config-rp2350.toml` carries the RP2350 build options, including a
# RISC-V (Hazard3) alternative.

[alias]
# Every alias names its board config file and its features. No feature is a
# default, and the config file is what supplies the board's target, rustflags and
# probe, so the target and the HAL always change together. Each section lines its
# options up in columns.

# The two boards. `rp2350` is the Interstate 75 W; `rp2040` builds the same
# driver for the RP2040.
build-rp2350 = "build --config .cargo/config-rp2350.toml --release --features rp2350"
run-rp2350   = "run   --config .cargo/config-rp2350.toml --release --features rp2350"
build-rp2040 = "build --config .cargo/config-rp2040.toml --release --features rp2040"
run-rp2040   = "run   --config .cargo/config-rp2040.toml --release --features rp2040"

# The lint, doc and test passes the scripts use; they name the board too, so the
# scripts carry no flags. The test pass keeps the debug profile: `src/driver.rs`
# relies on `debug_assert!`, which `--release` would compile out.
clippy-rp2350 = "clippy --config .cargo/config-rp2350.toml --release --features rp2350"
doc-rp2350    = "doc    --config .cargo/config-rp2350.toml --no-deps --features rp2350"
test-rp2350   = "test   --config .cargo/config-rp2350.toml --lib     --features rp2350"

# The examples, each naming its board config and features itself.
run-gradient       = "run --config .cargo/config-rp2350.toml --release --example gradient  --features rp2350"
run-ghost          = "run --config .cargo/config-rp2350.toml --release --example ghost     --features rp2350"
run-ladder         = "run --config .cargo/config-rp2350.toml --release --example ladder    --features rp2350"
run-latched        = "run --config .cargo/config-rp2350.toml --release --example latched   --features rp2350"
run-telemetry      = "run --config .cargo/config-rp2350.toml --release --example telemetry --features rp2350"
run-latched-rp2040 = "run --config .cargo/config-rp2040.toml --release --example latched   --features rp2040"

[env]
DEFMT_LOG = "info"
