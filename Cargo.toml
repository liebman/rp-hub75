[package]
authors = ["liebman <liebman@zod.com>"]
categories = ["embedded", "hardware-support", "no-std"]
description = "A HUB75 LED matrix driver for RP2040 and RP2350 (Pimoroni Interstate 75 W)"
edition = "2024"
keywords = ["hub75", "rp2040", "rp2350", "led-matrix", "embedded"]
license = "MIT OR Apache-2.0"
name = "rp-hub75"
rust-version = "1.85"
version = "0.1.0"

[lib]
name = "rp_hub75"

[features]
# The backend family. Exactly one: `rphal` is `rp2040-hal`/`rp235x-hal`, `embassy`
# is `embassy-rp`. Both select the HAL the driver is written against and the `hal`
# path the examples import.
#
# Cargo features are additive, so `rphal` names *both* chips' crates; the axes are
# kept apart by the *target* instead — each chip's rp-hal crate is declared under
# that chip's target table below, so the wrong chip's crate is never built.
rphal = ["dep:rp235x-hal", "dep:rp2040-hal", "dep:rp2040-boot2"]
embassy = ["dep:embassy-rp", "embassy-rp/critical-section-impl", "embassy-rp/rt", "embassy-rp/time-driver", "embassy-rp/unstable-pac"]

# The chip. Exactly one. For rp-hal the crate follows from the chip's target table,
# so the feature is a marker; for embassy-rp it sets the crate's chip with the weak
# `?`, a no-op in an rp-hal build, where embassy-rp is not enabled.
rp2350 = ["embassy-rp?/rp235xa"]
rp2040 = ["embassy-rp?/rp2040"]

# --- Library features --------------------------------------------------------
#
# These change how the driver drives the panel. The ones that forward to
# `hub75-framebuffer` change the words it streams.
#
# Invert the clock pin's output in the GPIO block, for a panel that takes a column
# on the clock's falling edge. Builds for both chips; measured on the RP2350,
# untested on the RP2040.
invert-clock = []

# Forward the output-enable polarity to `hub75-framebuffer`: the OE pin is driven
# out of the framebuffer's words, so that crate is the only place the level lives.
invert-oe = ["hub75-framebuffer/invert-oe"]

skip-black-pixels = ["hub75-framebuffer/skip-black-pixels"]
tail-closes-latch = ["hub75-framebuffer/tail-closes-latch"]
lead-blank-1 = ["hub75-framebuffer/lead-blank-1"]
lead-blank-2 = ["hub75-framebuffer/lead-blank-2"]
lead-blank-4 = ["hub75-framebuffer/lead-blank-4"]
lead-blank-8 = ["hub75-framebuffer/lead-blank-8"]
lead-blank-16 = ["hub75-framebuffer/lead-blank-16"]
lead-blank-32 = ["hub75-framebuffer/lead-blank-32"]
trail-blank-1 = ["hub75-framebuffer/trail-blank-1"]
trail-blank-2 = ["hub75-framebuffer/trail-blank-2"]
trail-blank-4 = ["hub75-framebuffer/trail-blank-4"]
trail-blank-8 = ["hub75-framebuffer/trail-blank-8"]
trail-blank-16 = ["hub75-framebuffer/trail-blank-16"]
trail-blank-32 = ["hub75-framebuffer/trail-blank-32"]

inter-row-blank-4 = ["hub75-framebuffer/inter-row-blank-4"]
inter-row-blank-8 = ["hub75-framebuffer/inter-row-blank-8"]
inter-row-blank-16 = ["hub75-framebuffer/inter-row-blank-16"]
inter-row-blank-32 = ["hub75-framebuffer/inter-row-blank-32"]

reverse-row-order = ["hub75-framebuffer/reverse-row-order"]

# --- Example features --------------------------------------------------------
#
# Read by `examples/` only; they change nothing in the library.
#
# The examples' panel clock: 10 MHz without it, 20 MHz with it. The divider is an
# integer rounded up, so 20 MHz lands on 18.75 MHz at the examples' 150 MHz.
20mhz = []

[dependencies]
# Shared with the DMA interrupt, so in a `critical_section::Mutex` (and an
# `AtomicBool` for the swap flag); `rp235x-hal`'s `critical-section-impl` makes
# `critical_section` real.
critical-section = "1.2"
# For `cortex_m::peripheral::NVIC::unmask`, the driver's DMA-line unmask.
cortex-m = "0.7"
embedded-graphics = "0.8.2"
# Native atomics on the RP2350; the RP2040's target table adds `critical-section`.
portable-atomic = { version = "1", default-features = false }
# `interstate75` puts word bit n on pin n, so one `out pins, 14` writes the bus.
hub75-framebuffer = { version = "0.13.0", features = ["interstate75"] }
pio = "0.3"
# The second backend: the same PIO and DMA through embassy-rp, its chip set by
# `rp2040`/`rp2350` and no `time-driver`.
embassy-rp = { version = "0.10", optional = true, default-features = false }
# The `Rate` type the API uses; `rp-hal` re-exports it, `embassy-rp` does not.
fugit = "0.3"
# The `StaticCell` `hub75_descriptors!` allocates, so a real dependency.
static_cell = "2.1"

[dev-dependencies]
# The examples are bare-metal; `#[entry]` names the `cortex_m_rt` crate.
cortex-m-rt = "0.7"
# The examples' log. Neither dependency's defmt feature can be on (`rp235x-hal`
# wants `<0.4`, `hub75-framebuffer` `1.0`; two majors cannot share an image).
defmt = "1"
# `disable-blocking-mode` is required: a blocking RTT write would stall the display
# loop. Dropping a frame is the right failure.
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"] }
embedded-hal = "1.0"
# The embassy example's executor and clock; the library is executor-agnostic.
embassy-executor = { version = "0.10", features = ["executor-thread", "platform-cortex-m"] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
# A panic prints its message and location over RTT, then halts.
panic-probe = { version = "1", features = ["print-defmt"] }

[[example]]
name = "gradient"
required-features = ["rphal"]

[[example]]
name = "ghost"
required-features = ["rphal"]

[[example]]
name = "starfield"
required-features = ["rphal"]

[[example]]
name = "ladder"
required-features = ["rphal"]

[[example]]
name = "latched"
required-features = ["rphal"]

[[example]]
name = "telemetry"
required-features = ["rphal"]

[[example]]
name = "gradient-embassy"
required-features = ["embassy"]

[profile.dev]
debug = true
opt-level = "s"

[profile.release]
debug = true
opt-level = "s"

# --- Target-specific dependencies --------------------------------------------
#
# Each chip's rp-hal crate is declared only in its own chip's target table, so the
# wrong chip's crate is never resolved even though `rphal` enables both `dep:` names.
# The `thumbv8m.main` triple contains a dot, which TOML would read as nested keys, so
# the table key is quoted.
#
# The host entry keeps the library buildable for the host tests and `cargo doc`: it is
# the RP2350 HAL, and `not(target_os = "none")` is true only off bare metal, so it does
# not match a chip build.
[target.'cfg(not(target_os = "none"))'.dependencies]
rp235x-hal = { version = "0.4.0", optional = true, features = [
    "binary-info",
    "critical-section-impl",
    "rt",
] }

[target."thumbv8m.main-none-eabihf".dependencies]
rp235x-hal = { version = "0.4.0", optional = true, features = [
    "binary-info",
    "critical-section-impl",
    "rt",
] }

[target.thumbv6m-none-eabi.dependencies]
rp2040-hal = { version = "0.12.0", optional = true, features = [
    "critical-section-impl",
    "rt",
] }
# The RP2040 ROM runs a 256-byte second-stage bootloader from flash before the
# application; each example places this crate's code in `.boot2`.
rp2040-boot2 = { version = "0.3.0", optional = true }
# The RP2040 (Cortex-M0+) has no atomic compare-and-swap, so the driver and
# `static_cell` get one through a critical section. The RP2350 (Cortex-M33) has real
# atomics.
portable-atomic = { version = "1", default-features = false, features = [
    "critical-section",
] }

# Optional: develop against the sibling `hub75-framebuffer` checkout instead of
# the published crate. Uncomment both lines to override.
# [patch.crates-io]
# hub75-framebuffer = { path = "../hub75-framebuffer" }
