[package]
authors = ["liebman <liebman@zod.com>"]
categories = ["embedded", "hardware-support", "no-std"]
description = "A HUB75 LED matrix driver for RP2040 and RP2350 (Pimoroni Interstate 75 W)"
edition = "2024"
keywords = ["hub75", "rp2040", "rp2350", "led-matrix", "embedded"]
license = "MIT OR Apache-2.0"
name = "rp-hub75"
rust-version = "1.85"
version = "0.1.0"

[lib]
name = "rp_hub75"

[features]
# No feature is a default. The target is two independent axes, and both are named
# on the command line: the backend, `rphal` or `embassy`, and the chip, `rp2040`
# or `rp2350`. Exactly one of each, so `--features rphal,rp2350` is the RP2350
# driven through rp-hal. The aliases in `.cargo/config.toml` name a pair
# together with the matching `.cargo/config-*.toml`, and a build missing an axis
# stops on the `compile_error!` in `src/lib.rs`.

# --- Target selection --------------------------------------------------------
#
# The backend family. Exactly one. `rphal` is `rp2040-hal`/`rp235x-hal`, which
# share `rp-hal-common`; `embassy` is `embassy-rp`. They select the HAL the
# driver is written against — the PIO and DMA register blocks are the same shape
# on both parts — and the `hal` path the examples import.
#
# Cargo features are additive, so a feature cannot pull a dependency only when a
# second feature is also set, and `rphal` names *both* chips' crates. The axes
# are kept apart by the *target* instead: each chip's rp-hal crate is declared
# under that chip's target table below, so the wrong chip's crate is never built.
rphal = ["dep:rp235x-hal", "dep:rp2040-hal", "dep:rp2040-boot2"]
embassy = ["dep:embassy-rp", "embassy-rp/critical-section-impl", "embassy-rp/rt", "embassy-rp/time-driver", "embassy-rp/unstable-pac"]

# The chip. Exactly one. `rp2350` is the Interstate 75 W and every board this
# crate has been flashed on; `rp2040` builds the same driver for the RP2040. The
# rp-hal crate follows from the chip's target table, so the feature is a marker
# there; for embassy-rp it sets the crate's chip with the weak `?`, which is a
# no-op in an rp-hal build, where embassy-rp is not enabled.
rp2350 = ["embassy-rp?/rp235xa"]
rp2040 = ["embassy-rp?/rp2040"]

# --- Library features --------------------------------------------------------
#
# These change what the driver compiles and how it drives the panel. The ones
# that forward to `hub75-framebuffer` change the words the driver streams: the
# framebuffer's layout, and the blanking it inserts around rows.
#
# Invert the panel's shift clock in the GPIO block, for a panel that takes a
# column on the clock's falling edge. The clock is the one signal the PIO
# generates rather than copies out of the framebuffer's words, so its polarity
# belongs to the pad (`IO_BANK0` `GPIOx` `CTRL` `OUTOVER`) and one program runs
# either way. Builds for both chips; measured on the RP2350, untested on the
# RP2040.
invert-clock = []

# Forward the panel's output-enable polarity to `hub75-framebuffer`, rather
# than defining a second switch that can disagree with it. The OE pin is
# driven straight out of the framebuffer's words, so the crate's words are the
# only place the blanking level lives.
invert-oe = ["hub75-framebuffer/invert-oe"]

skip-black-pixels = ["hub75-framebuffer/skip-black-pixels"]
tail-closes-latch = ["hub75-framebuffer/tail-closes-latch"]
lead-blank-1 = ["hub75-framebuffer/lead-blank-1"]
lead-blank-2 = ["hub75-framebuffer/lead-blank-2"]
lead-blank-4 = ["hub75-framebuffer/lead-blank-4"]
lead-blank-8 = ["hub75-framebuffer/lead-blank-8"]
lead-blank-16 = ["hub75-framebuffer/lead-blank-16"]
lead-blank-32 = ["hub75-framebuffer/lead-blank-32"]
trail-blank-1 = ["hub75-framebuffer/trail-blank-1"]
trail-blank-2 = ["hub75-framebuffer/trail-blank-2"]
trail-blank-4 = ["hub75-framebuffer/trail-blank-4"]
trail-blank-8 = ["hub75-framebuffer/trail-blank-8"]
trail-blank-16 = ["hub75-framebuffer/trail-blank-16"]
trail-blank-32 = ["hub75-framebuffer/trail-blank-32"]

inter-row-blank-4 = ["hub75-framebuffer/inter-row-blank-4"]
inter-row-blank-8 = ["hub75-framebuffer/inter-row-blank-8"]
inter-row-blank-16 = ["hub75-framebuffer/inter-row-blank-16"]
inter-row-blank-32 = ["hub75-framebuffer/inter-row-blank-32"]

reverse-row-order = ["hub75-framebuffer/reverse-row-order"]

# --- Example features --------------------------------------------------------
#
# Read by `examples/` only; they change nothing in the library.
#
# The examples' panel clock: 10 MHz with this off, 20 MHz with it, as the
# esp-hub75 examples do. The driver takes whatever rate it is given and rounds
# the divider up, so 20 MHz here means "as close to 20 MHz as a divider allows
# without exceeding it" — 18.75 MHz on the examples' 150 MHz system clock, which
# is the configuration the examples' rates were measured at.
20mhz = []

[dependencies]
# The driver's swap state is shared with the DMA interrupt, so it lives in a
# `critical_section::Mutex`. `rp235x-hal`'s `critical-section-impl` means
# `critical_section` is real.
critical-section = "1.2"
# `cortex_m::peripheral::NVIC::unmask` is how the driver unmasks its DMA line: both
# HALs' PACs implement `InterruptNumber` for their `Interrupt`, and `hal::arch`'s
# own unmask is named differently on the two (rp235x-hal has `interrupt_unmask`,
# rp2040-hal only global `interrupt_enable`).
cortex-m = "0.7"
embedded-graphics = "0.8.2"
# The driver's swap flags are `AtomicBool`s shared with the DMA interrupt. On a
# target with native atomics this forwards to `core`; on the RP2040 (thumbv6m),
# which has no atomic compare-and-swap, the target-specific dependency below
# enables the `critical-section` feature so the CAS exists. `static_cell` needs
# the same feature there.
portable-atomic = { version = "1", default-features = false }
# `interstate75` reorders the plain bitplane words so bit n is pin n for the
# whole HUB75 bus (GP0-13), which is what lets one `out pins, 14` put a word
# straight on the pins. See `src/backend/programs.rs`.
hub75-framebuffer = { version = "0.13.0", features = ["interstate75"] }
pio = "0.3"
# The `rp2040`/`rp235x` HALs are not here: they are target-specific, and live in
# the chip tables at the end of this file so `rphal` can name both without
# building the wrong chip's crate. They share `rp-hal-common` and `pio 0.3`, so
# the driver's PIO and DMA code is identical against either; only the crate name
# and the PAC behind it change.
#
# The second backend: the same PIO and DMA driven through embassy-rp's async,
# channel/state-machine API rather than rp-hal's. The `embassy` feature selects
# it; the chip feature carries embassy-rp's chip. Its chip is set weakly by
# `rp2040`/`rp2350`, and its `time-driver` is not enabled: the driver needs no
# timer, and `clk_sys_freq()` reports the clock without one.
embassy-rp = { version = "0.10", optional = true, default-features = false }
# `fugit` is the `Rate` type the API uses. `rp-hal` re-exports it as
# `hal::fugit`; `embassy-rp` does not, so the crate names it directly and both
# backends build against one version.
fugit = "0.3"
# The descriptor table is the caller's storage, and `hub75_descriptors!` puts it
# in a `StaticCell`. A dependency rather than a dev-dependency: the macro names
# it from downstream crates, through the crate root's re-export.
static_cell = "2.1"

[dev-dependencies]
# The examples are bare-metal binaries: `rp2040-hal`'s `#[entry]` expands to code
# that names the `cortex_m_rt` crate, so the examples link it directly. (On the
# RP2350 the HAL re-exports what the macro needs.)
cortex-m-rt = "0.7"
# The examples log over RTT; the library itself does not log and does not depend
# on defmt, so this is a dev-dependency and an example's log is plain
# `defmt::info!`. `rp235x-hal` wants `defmt <0.4` and `hub75-framebuffer` wants
# `1.0`, and two defmt majors cannot share an image, so neither crate's defmt
# feature is on and only the examples' own primitives reach the log.
defmt = "1"
# `disable-blocking-mode` is not optional here: probe-rs puts RTT into blocking
# mode, so a host that stops reading would block a log call — and a log call that
# blocks the display loop is a frozen panel, which this project has already been
# bitten by twice (the old USB CDC writer). Dropping a frame is the right failure.
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"] }
embedded-hal = "1.0"
# The embassy example's executor. A dev-dependency: the library is executor- and
# backend-agnostic, and `wait_for_done()` works under any executor.
embassy-executor = { version = "0.10", features = ["executor-thread", "platform-cortex-m"] }
# The embassy example's clock, for the gradient demo's status lines. The
# `time-driver` feature on embassy-rp starts it in `embassy_rp::init`.
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
# A panic prints its message and location over RTT, then halts. (No default
# features, so `print-defmt` has to be asked for.)
panic-probe = { version = "1", features = ["print-defmt"] }

[[example]]
name = "gradient"
required-features = ["rphal"]

[[example]]
name = "ghost"
required-features = ["rphal"]

[[example]]
name = "starfield"
required-features = ["rphal"]

[[example]]
name = "ladder"
required-features = ["rphal"]

[[example]]
name = "latched"
required-features = ["rphal"]

[[example]]
name = "telemetry"
required-features = ["rphal"]

[[example]]
name = "gradient-embassy"
required-features = ["embassy"]

[profile.dev]
debug = true
opt-level = "s"

[profile.release]
debug = true
opt-level = "s"

# --- Target-specific dependencies --------------------------------------------
#
# The `rphal` feature names both chips' rp-hal crates, and each is declared only
# in its own chip's target table, so the wrong chip's crate is never resolved
# even though its `dep:` name is enabled. The `thumbv8m.main` triple contains a
# dot, which TOML would read as nested keys, so the table key is quoted.
#
# The host entry keeps the library buildable for the host tests and `cargo doc`:
# the host is not a chip, and it uses the RP2350 HAL. `not(target_os = "none")`
# is true only off bare metal, so it does not match a chip build.
[target.'cfg(not(target_os = "none"))'.dependencies]
rp235x-hal = { version = "0.4.0", optional = true, features = [
    "binary-info",
    "critical-section-impl",
    "rt",
] }

[target."thumbv8m.main-none-eabihf".dependencies]
rp235x-hal = { version = "0.4.0", optional = true, features = [
    "binary-info",
    "critical-section-impl",
    "rt",
] }

[target.thumbv6m-none-eabi.dependencies]
rp2040-hal = { version = "0.12.0", optional = true, features = [
    "critical-section-impl",
    "rt",
] }
# The RP2040 ROM executes a 256-byte second-stage bootloader from the start of
# flash before the application. `rp2040-boot2` provides its code as
# `BOOT2_FIRMWARE`, which each example places in `.boot2`.
rp2040-boot2 = { version = "0.3.0", optional = true }
# On the RP2040 the atomic compare-and-swap the driver and `static_cell` need is
# provided through a critical section, because the Cortex-M0+ has none. The
# RP2350 (Cortex-M33) has real atomics, so this does not apply there.
portable-atomic = { version = "1", default-features = false, features = [
    "critical-section",
] }

# Optional: develop against the sibling `hub75-framebuffer` checkout instead of
# the published crate. Uncomment both lines to override.
# [patch.crates-io]
# hub75-framebuffer = { path = "../hub75-framebuffer" }
