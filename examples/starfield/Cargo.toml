[package]
name = "starfield"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[features]
# The chip, forwarded to the library. Exactly one, named by an alias in
# `.cargo/config.toml`.
rp2350 = ["rp-hub75/rp2350"]
rp2040 = ["rp-hub75/rp2040"]
# The panel clock: 10 MHz without it, 20 MHz with it (the divider rounds up, so
# 20 MHz lands on 18.75 MHz).
20mhz = []

# ---- rp-hub75 feature pass-through ----
#
# The panel tunings, each forwarded to the library, so an example build selects a
# panel's tuning: `cargo run-rp2350 --features invert-oe`, or several at once.
invert-clock = ["rp-hub75/invert-clock"]
invert-oe = ["rp-hub75/invert-oe"]
skip-black-pixels = ["rp-hub75/skip-black-pixels"]
tail-closes-latch = ["rp-hub75/tail-closes-latch"]
lead-blank-1 = ["rp-hub75/lead-blank-1"]
lead-blank-2 = ["rp-hub75/lead-blank-2"]
lead-blank-4 = ["rp-hub75/lead-blank-4"]
lead-blank-8 = ["rp-hub75/lead-blank-8"]
lead-blank-16 = ["rp-hub75/lead-blank-16"]
lead-blank-32 = ["rp-hub75/lead-blank-32"]
trail-blank-1 = ["rp-hub75/trail-blank-1"]
trail-blank-2 = ["rp-hub75/trail-blank-2"]
trail-blank-4 = ["rp-hub75/trail-blank-4"]
trail-blank-8 = ["rp-hub75/trail-blank-8"]
trail-blank-16 = ["rp-hub75/trail-blank-16"]
trail-blank-32 = ["rp-hub75/trail-blank-32"]
inter-row-blank-4 = ["rp-hub75/inter-row-blank-4"]
inter-row-blank-8 = ["rp-hub75/inter-row-blank-8"]
inter-row-blank-16 = ["rp-hub75/inter-row-blank-16"]
inter-row-blank-32 = ["rp-hub75/inter-row-blank-32"]
reverse-row-order = ["rp-hub75/reverse-row-order"]

[dependencies]
rp-hub75 = { path = "../..", features = ["rphal"] }
embedded-graphics = "0.8.2"
# The framebuffers' `'static` storage. The framebuffer crate itself is not named:
# its layout and types arrive through `rp_hub75::framebuffer`.
static_cell = "2.1"
# The log. `disable-blocking-mode` is required: a blocking RTT write would stall
# the display loop.
defmt = "1"
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"] }
panic-probe = { version = "1", features = ["print-defmt"] }
# The `rp2040-hal` `entry` macro names `cortex_m_rt` in the crate root.
cortex-m-rt = "0.7"

# The HAL features an end binary needs — the RT vector table, the picotool header
# and the critical-section impl — live here, not in the library.
[target."thumbv8m.main-none-eabihf".dependencies]
rp235x-hal = { version = "0.4.0", features = [
    "binary-info",
    "critical-section-impl",
    "rt",
] }

[target.thumbv6m-none-eabi.dependencies]
rp2040-hal = { version = "0.12.0", features = [
    "critical-section-impl",
    "rt",
] }
# The RP2040 ROM runs a 256-byte second-stage bootloader from flash before the
# application; the example places this crate's code in `.boot2`.
rp2040-boot2 = "0.3.0"

[profile.dev]
debug = true
opt-level = "s"

[profile.release]
debug = true
opt-level = "s"

# Optional: develop against the sibling `hub75-framebuffer` checkout instead of
# the published crate. This package is its own workspace, so the patch is per
# example; uncomment both lines to override.
# [patch.crates-io]
# hub75-framebuffer = { path = "../../../hub75-framebuffer" }
